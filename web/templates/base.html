<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Birdwatcher{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  {% block head %}{% endblock %}
</head>
<body>
  <header>
    <h1>🐦 uws_birdwatcher</h1>
    <nav>
      <a href="/" class="{{ 'on' if active == 'feed' }}">Live feed</a>
      <a href="/stats" class="{{ 'on' if active == 'stats' }}">Daily stats</a>
      <a href="/species" class="{{ 'on' if active == 'species' }}">Life list</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
